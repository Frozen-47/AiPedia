name: Daily AI Pulse & Auto Commit

on:
  schedule:
    # Runs daily at midnight (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  daily-pulse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Daily Pulse Sync
        run: node scripts/daily_pulse.js

      - name: Commit and push daily intelligence updates
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/ DAILY_PULSE.md README.md
          if git diff --staged --quiet; then
            echo "No updates to commit today."
          else
            git commit -m "chore(pulse): sync daily AI trends, catalog metrics & ecosystem health [skip ci]"
            git push origin HEAD:${{ github.ref }}
          fi
